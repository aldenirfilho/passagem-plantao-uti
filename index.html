<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Passagem de Plantão UTI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background:#f5f7fb; }
    h1 { margin-bottom: 8px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 12px; }
    button { padding:10px 14px; border-radius:10px; border:0; cursor:pointer; }
    .primary { background:#2563eb; color:white; }
    .secondary { background:#e5e7eb; }
    .danger { background:#ef4444; color:white; }
    .card { background:white; border-radius:16px; padding:12px; margin-bottom:12px; box-shadow: 0 6px 16px rgba(0,0,0,.08); }
    .grid { display:grid; grid-template-columns: repeat(1, 1fr); gap:8px; }
    @media (min-width: 900px){ .grid{ grid-template-columns: repeat(3, 1fr);} }
    label { font-size: 12px; color:#374151; }
    input, textarea { width:100%; padding:8px; border-radius:10px; border:1px solid #d1d5db; }
    textarea { min-height:60px; }
    .span-3 { grid-column: 1 / -1; }
    .footer { display:flex; justify-content:flex-end; }
  </style>
</head>
<body>
  <h1>Passagem de Plantão UTI</h1>
  <div class="toolbar">
    <button class="primary" onclick="addPatient()">Adicionar Paciente</button>
    <button class="secondary" onclick="exportJSON()">Exportar</button>
    <button class="secondary" onclick="window.print()">Imprimir</button>
    <span style="align-self:center;color:#6b7280">Salva automaticamente neste navegador</span>
  </div>

  <div id="list"></div>

<script>
  const emptyPatient = {
    leito: "", nome: "", diagnostico: "", comorbidades: "", suporte: "",
    intercorrencias: "", laboratorio: "", imagem: "", antibioticos: "",
    profilaxias: "", pendencias: "", condutas: ""
  };

  let patients = JSON.parse(localStorage.getItem("uti_patients") || "null");
  if (!patients || !Array.isArray(patients) || patients.length === 0) {
    patients = [ JSON.parse(JSON.stringify(emptyPatient)) ];
  }

  function save() {
    localStorage.setItem("uti_patients", JSON.stringify(patients));
  }

  function addPatient() {
    patients.push(JSON.parse(JSON.stringify(emptyPatient)));
    render();
  }

  function removePatient(i) {
    patients.splice(i, 1);
    if (patients.length === 0) patients.push(JSON.parse(JSON.stringify(emptyPatient)));
    render();
  }

  function update(i, field, value) {
    patients[i][field] = value;
    save();
  }

  function exportJSON() {
    const data = JSON.stringify(patients, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "passagem_plantao_uti.json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function render() {
    const root = document.getElementById("list");
    root.innerHTML = "";
    patients.forEach((p, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="grid">
          <div><label>Leito</label><input value="${p.leito}" oninput="update(${i}, 'leito', this.value)"></div>
          <div><label>Nome / Idade</label><input value="${p.nome}" oninput="update(${i}, 'nome', this.value)"></div>
          <div class="span-3"><label>Diagnóstico</label><input value="${p.diagnostico}" oninput="update(${i}, 'diagnostico', this.value)"></div>

          <div><label>Comorbidades</label><input value="${p.comorbidades}" oninput="update(${i}, 'comorbidades', this.value)"></div>
          <div><label>Suporte (VM, DVA, O2)</label><input value="${p.suporte}" oninput="update(${i}, 'suporte', this.value)"></div>
          <div><label>Antibióticos</label><input value="${p.antibioticos}" oninput="update(${i}, 'antibioticos', this.value)"></div>

          <div class="span-3"><label>Intercorrências</label><textarea oninput="update(${i}, 'intercorrencias', this.value)">${p.intercorrencias}</textarea></div>

          <div><label>Laboratório</label><textarea oninput="update(${i}, 'laboratorio', this.value)">${p.laboratorio}</textarea></div>
          <div><label>Imagem</label><textarea oninput="update(${i}, 'imagem', this.value)">${p.imagem}</textarea></div>
          <div><label>Profilaxias</label><textarea oninput="update(${i}, 'profilaxias', this.value)">${p.profilaxias}</textarea></div>

          <div class="span-3"><label>Pendências</label><textarea oninput="update(${i}, 'pendencias', this.value)">${p.pendencias}</textarea></div>
          <div class="span-3"><label>Condutas / Plano</label><textarea oninput="update(${i}, 'condutas', this.value)">${p.condutas}</textarea></div>

          <div class="span-3 footer">
            <button class="danger" onclick="removePatient(${i})">Remover Paciente</button>
          </div>
        </div>
      `;
      root.appendChild(card);
    });
    save();
  }

  render();
</script>
</body>
</html>
