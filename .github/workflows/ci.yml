name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node and Chromium QA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run Node test suite
        run: npm test

      - name: Run synthetic browser QA
        run: npm run test:e2e

      - name: Audit high-severity production dependencies
        run: npm audit --audit-level=high

